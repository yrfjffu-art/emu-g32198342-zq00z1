name: RepoForge Android
run-name: RepoForge ${{ inputs.mode }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: build or emulator
        default: build
        type: string
      tasks:
        default: assembleDebug
        type: string
      flags:
        default: ''
        type: string
      tag:
        required: true
        type: string
      emulator:
        default: 'false'
        type: string
      input_tag:
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: rf-${{ inputs.tag }}
jobs:
  build:
    if: ${{ inputs.mode == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (project wrapper)
        if: ${{ hashFiles('gradlew') != '' }}
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Gradle 8.9
        if: ${{ hashFiles('gradlew') == '' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          RF_KS: ${{ secrets.RF_KEYSTORE_B64 }}
        run: bash .github/rf/keystore.sh
      - name: Gradle build
        env:
          RF_TASKS: ${{ inputs.tasks }}
          RF_FLAGS: ${{ inputs.flags }}
          RF_STORE_PASSWORD: ${{ secrets.RF_STORE_PASSWORD }}
          RF_KEY_ALIAS: ${{ secrets.RF_KEY_ALIAS }}
          RF_KEY_PASSWORD: ${{ secrets.RF_KEY_PASSWORD }}
        run: bash .github/rf/build.sh
      - name: Collect, sign and inspect
        if: ${{ always() }}
        env:
          RF_STORE_PASSWORD: ${{ secrets.RF_STORE_PASSWORD }}
          RF_KEY_ALIAS: ${{ secrets.RF_KEY_ALIAS }}
          RF_KEY_PASSWORD: ${{ secrets.RF_KEY_PASSWORD }}
        run: bash .github/rf/collect.sh
      - name: Publish release
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RF_TAG: ${{ inputs.tag }}
        run: bash .github/rf/release.sh
  emulator:
    needs: build
    if: ${{ always() && (inputs.mode == 'emulator' || (inputs.emulator == 'true' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          RF_SRC_TAG: ${{ inputs.mode == 'emulator' && inputs.input_tag || inputs.tag }}
        run: bash .github/rf/fetch-apk.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/rf/emulator.sh
      - name: Upload preview
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RF_TAG: ${{ inputs.tag }}
        run: bash .github/rf/preview-upload.sh
